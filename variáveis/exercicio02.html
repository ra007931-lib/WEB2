<script>
    let valorConta = Number(prompt("Digite o valor da conta: R$"));
    let numClientes = Number(prompt("Digite o número de clientes:"));

    let valorPorCliente = valorConta / numClientes;

    console.log("Valor da conta R$: " + valorConta);
    console.log("Número de clientes: " + numClientes);
    console.log("Valor por cliente R$: " + valorPorCliente);
</script>
